    <text x="161" y="231" font-size="8" fill="#1a2a6c" text-anchor="middle" font-family="'Comic Sans MS','Marker Felt',cursive">Samuel</text>
    <text x="161" y="240" font-size="8" fill="#1a2a6c" text-anchor="middle" font-family="'Comic Sans MS','Marker Felt',cursive">Howardstein</text>
  </g>
