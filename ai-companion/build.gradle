plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "ai-companion" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// Libraries bundled inside the mod jar (jar-in-jar), including their transitive dependencies.
configurations {
    bundled
    implementation.extendsFrom bundled
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    bundled "com.anthropic:anthropic-java:${project.anthropic_version}"
}

afterEvaluate {
    // Minecraft already ships these, so there is no need to bundle a second copy.
    def providedByMinecraft = ['com.google.guava', 'com.google.code.gson', 'org.slf4j', 'com.google.errorprone', 'org.checkerframework', 'com.google.j2objc', 'com.google.code.findbugs']
    configurations.bundled.resolvedConfiguration.resolvedArtifacts.each { artifact ->
        def id = artifact.moduleVersion.id
        if (!providedByMinecraft.contains(id.group)) {
            dependencies.add('include', "${id.group}:${id.name}:${id.version}")
        }
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
